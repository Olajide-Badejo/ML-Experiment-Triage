version: 2

# Two ecosystems, because this repository has two kinds of pin that go stale in
# different ways. `pip` covers requirements.txt, which is the resolution every
# measured number in this project was produced under; `github-actions` covers
# the workflow, where an unpinned major version is how a green build starts
# failing for reasons unconnected to the code.
#
# Weekly rather than daily. A statistics library that publishes measured error
# rates has to rerun its calibration suite against a new numpy or scipy before
# accepting one, and a daily pull request for that is a pull request nobody
# reads.

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # The development toolchain moves often and breaks nothing a user sees,
      # so it arrives as one pull request rather than six.
      development:
        patterns:
          - build
          - mypy
          - nox
          - pytest
          - pytest-cov
          - ruff
          - twine
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
