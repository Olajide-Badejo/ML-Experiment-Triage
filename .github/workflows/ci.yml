name: CI

# Everything in this project runs on CPU, so CI runs the real suite rather than
# a subset. The calibration tests are the point of having tests here at all, and
# skipping them in CI would leave the one claim that matters unverified.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, tests and calibration gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Check formatting and lint
        run: |
          python -m ruff format --check .
          python -m ruff check .

      # poppler-utils supplies pdftotext, which the guard uses to check the
      # text inside the committed PDFs and not merely their sources.
      - name: Install poppler for the PDF text check
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Dash guard over sources and committed PDFs
        run: python scripts/check_no_dashes.py .

      - name: The Markdown documents match the measured calibration
        run: python scripts/render_calibration_docs.py --check

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Statistical calibration gates
        run: python -m pytest tests/statistics -q -s

      - name: Integration tests
        run: python -m pytest tests/integration -q

      - name: Demo workflow
        run: python -m examples.demo_workflow --quiet

      - name: Verify the demo reproduces its committed verdicts
        run: python -m examples.demo_workflow --verify-committed --quiet

      - name: Upload the generated HTML report
        uses: actions/upload-artifact@v4
        with:
          name: triage-report-html
          path: experiments/results/triage_report.html
          if-no-files-found: error

  reports:
    name: Compile the PDFs from the committed database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      # Recommends are left on deliberately. The documents need pgfplots and its
      # fillbetween library, booktabs, microtype and hyperref, and trimming
      # recommended packages is the usual way a TeX build fails on a runner with
      # an error that points at the document rather than at the missing package.
      - name: Install TeX Live and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-pictures \
            texlive-plain-generic \
            poppler-utils

      # Fail here with a clear message if a package is missing, rather than
      # 300 lines into a LaTeX log that blames the document.
      - name: Confirm the LaTeX toolchain is present
        run: |
          pdflatex --version | head -1
          kpsewhich pgfplots.sty
          kpsewhich booktabs.sty
          kpsewhich microtype.sty
          pdftotext -v 2>&1 | head -1

      # The reports compile from the committed demo database, so this job proves
      # the PDFs build from a plain checkout without regenerating the sweep.
      - name: Generate report assets from the committed database
        run: python scripts/gen_report_assets.py --database experiments/demo/triage.db --quiet

      - name: Compile the PDFs
        run: |
          python scripts/build_pdf.py report/main.tex --bibtex
          python scripts/build_pdf.py report_debug/debug_report.tex

      - name: Dash guard over sources and freshly compiled PDFs
        run: python scripts/check_no_dashes.py .

      - name: Upload the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: reports-pdf
          path: |
            report/main.pdf
            report_debug/debug_report.pdf
          if-no-files-found: error
