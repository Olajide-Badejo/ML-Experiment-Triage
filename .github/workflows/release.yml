name: Release

# Section 7 item 3, and release checklist item 7.
#
# **There is no API token anywhere in this repository or its secrets.**
# Publishing authenticates by OIDC: GitHub mints a short lived token for this
# workflow, PyPI verifies it against a Trusted Publisher registered for this
# repository, this workflow file, and the environment named below, and the
# credential expires with the job. A leaked token is not a risk that has been
# mitigated here; it is a risk that does not exist, because there is nothing to
# leak.
#
# PEP 740 attestations are generated by default by
# `pypa/gh-action-pypi-publish`, with no configuration: the action signs each
# distribution through Sigstore using the same OIDC identity and uploads the
# attestation alongside it. That is the whole supply chain story, and it is
# deliberately not supplemented with hand rolled SLSA provenance, which would be
# a large amount of YAML restating what the attestation already says.
#
# Two paths, and the dry run is the default one:
#
#   workflow_dispatch  builds, and publishes to TestPyPI when asked to. This is
#                      how the publishing path is verified without spending a
#                      version number, since PyPI never allows a filename to be
#                      reused even after a delete.
#   a v* tag           builds and publishes to PyPI, then attaches the two
#                      committed PDFs to the GitHub release.
#
# Trusted Publishing has to be registered on the index side first, at
# https://pypi.org/manage/account/publishing/, naming: the repository
# `Olajide-Badejo/ML-Experiment-Triage`, the workflow file `release.yml`, and
# the environment (`pypi` or `testpypi`). Registering it on TestPyPI as well is
# what makes the dry run a real rehearsal rather than a different mechanism.
#
# **Publishing is off until that registration exists**, and it is off by being
# skipped rather than by failing. Each publish job is gated on a repository
# variable, and a variable that has never been set is the empty string, so the
# default state of this workflow is "build, verify, attach the PDFs, publish
# nothing". A tag pushed before the publisher exists then produces a green
# release run with a visibly skipped job, instead of a red one whose failure is
# a configuration step nobody has done yet.
#
#   vars.PYPI_PUBLISHER_READY      set to `true` once the PyPI Trusted
#                                  Publisher for the `pypi` environment exists
#   vars.TESTPYPI_PUBLISHER_READY  the same for TestPyPI and `testpypi`
#
# Set them under Settings, Secrets and variables, Actions, Variables. They are
# variables and not secrets on purpose: the value is a fact about the index,
# not a credential, and there is still no credential anywhere in this
# repository.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish the built distributions to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pylock.toml

      - name: Install the locked toolchain
        run: |
          uv pip install --system -r pylock.toml
          uv pip install --system -e . --no-deps

      # The version lives in one file (D29), so a tag that disagrees with it is
      # a mistake worth catching before anything is uploaded: PyPI will not let
      # the filename be reused afterwards.
      - name: The tag matches the single version source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(python -c "from triage._version import VERSION; print(VERSION)")
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared $declared, tagged $tagged"
          test "$declared" = "$tagged"

      # The same session CI runs: build, twine check --strict, then install the
      # wheel into two throwaway environments outside the tree and make each do
      # its job, one with [cli] and one bare (D31, E1).
      - name: Build, check and smoke test the wheel
        run: nox -s package

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    # Skipped, not failed, while the TestPyPI Trusted Publisher does not exist.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.testpypi
      && vars.TESTPYPI_PUBLISHER_READY == 'true'

    environment:
      name: testpypi
      url: https://test.pypi.org/p/ml-experiment-triage

    permissions:
      # The only permission Trusted Publishing needs, and the reason no secret
      # is required: it lets the job ask GitHub for an OIDC token that names it.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    # Skipped, not failed, while the PyPI Trusted Publisher does not exist. An
    # unset repository variable is the empty string, so this is the default.
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      && vars.PYPI_PUBLISHER_READY == 'true'

    environment:
      name: pypi
      url: https://pypi.org/p/ml-experiment-triage

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist

      # Attestations are on by default. They are named here rather than left
      # implicit so that turning them off would have to be a visible edit.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  release-assets:
    name: Attach the PDFs to the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, pypi]

    # A skipped `pypi` must not take this job with it. A dependency that was
    # skipped skips its dependents by default, which would have meant that not
    # having registered a Trusted Publisher also silently removed the PDFs from
    # every release. So this runs whenever the build succeeded and publishing
    # did not actively fail, which covers both the gated and the ungated state.
    if: >-
      !cancelled()
      && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success'
      && needs.pypi.result != 'failure'

    permissions:
      contents: write

    # The PDFs are committed and the `reports` CI job proves the committed
    # bytes are the ones this tree builds, so the release can attach them
    # directly rather than installing TeX to rebuild what has already been
    # verified.
    steps:
      - uses: actions/checkout@v4

      - name: Upload the reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            report/main.pdf \
            report_debug/debug_report.pdf \
            --clobber
